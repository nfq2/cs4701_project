[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leduc-agents"
version = "0.1.0"
description = "CS 4701 experiments comparing agents in two-player Leduc Hold'em"
requires-python = ">=3.10"
dependencies = ["rlcard==1.2.0", "numpy>=1.24,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
leduc-match = "leduc.runner:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
